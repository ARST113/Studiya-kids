name: Build VTracer logo preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vtracer-preview.yml'
      - 'tools/logo-source-320.b64'

permissions:
  contents: write

concurrency:
  group: vtracer-logo-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install VTracer and rendering tools
        run: python -m pip install --disable-pip-version-check vtracer==1.0.0a4 pillow cairosvg

      - name: Prepare clean transparent logo source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview
          tr -d '\r\n\t ' < tools/logo-source-320.b64 | base64 -d > /tmp/logo-raw.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/logo-raw.png').convert('RGBA')
          im=im.crop((8,28,313,147))
          px=im.load()
          for y in range(im.height):
              for x in range(im.width):
                  r,g,b,a=px[x,y]
                  if max(abs(255-r),abs(255-g),abs(255-b)) < 34:
                      px[x,y]=(255,255,255,0)
          im.save('preview/logo-source-clean.png')
          print('prepared', im.size)
          PY

      - name: Vectorize with VTracer fixed palette
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import vtracer
          cfg=vtracer.Config.poster()
          cfg.hierarchical='cutout'
          cfg.mode='spline'
          cfg.filter_speckle=1
          cfg.simplify=0.8
          cfg.path_precision=2
          cfg.palette=['#3d301b','#a9eb3d','#ce3978','#5bdaf3','#fae42f']
          cfg.optimize=2
          cfg.convert_file('preview/logo-source-clean.png','preview/logo-vtracer.svg')
          PY
          test -s preview/logo-vtracer.svg
          grep -q '<svg' preview/logo-vtracer.svg
          ! grep -q '<image' preview/logo-vtracer.svg
          echo "paths=$(grep -o '<path' preview/logo-vtracer.svg | wc -l)"

      - name: Render and verify visually
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image
          import cairosvg, math

          cairosvg.svg2png(url='preview/logo-vtracer.svg',write_to='preview/logo-vtracer-preview.png',output_width=305,output_height=119)
          src=Image.open('preview/logo-source-clean.png').convert('RGBA')
          out=Image.open('preview/logo-vtracer-preview.png').convert('RGBA')

          # Foreground-mask overlap catches the previous failure mode: a dark rectangle / filled background.
          src_a=list(src.getchannel('A').getdata())
          out_a=list(out.getchannel('A').getdata())
          src_fg=[a>24 for a in src_a]
          out_fg=[a>24 for a in out_a]
          inter=sum(a and b for a,b in zip(src_fg,out_fg))
          union=sum(a or b for a,b in zip(src_fg,out_fg))
          iou=inter/union if union else 0
          out_ratio=sum(out_fg)/len(out_fg)
          src_ratio=sum(src_fg)/len(src_fg)

          # Compare shape/color after compositing on white.
          white=Image.new('RGBA',src.size,(255,255,255,255))
          s=Image.alpha_composite(white,src).convert('RGB')
          o=Image.alpha_composite(white,out).convert('RGB')
          sp=list(s.getdata()); op=list(o.getdata())
          mae=sum(abs(a-b) for p,q in zip(sp,op) for a,b in zip(p,q))/(len(sp)*3)

          # Corners must stay transparent; opaque corners would recreate the black-box problem.
          corners=[out.getpixel((0,0))[3],out.getpixel((304,0))[3],out.getpixel((0,118))[3],out.getpixel((304,118))[3]]
          corner_alpha=max(corners)

          metrics=f'source_foreground={src_ratio:.4f}\nvector_foreground={out_ratio:.4f}\nmask_iou={iou:.4f}\nmae={mae:.2f}\ncorner_alpha_max={corner_alpha}\n'
          open('preview/logo-quality.txt','w').write(metrics)
          print(metrics)

          assert 0.15 < out_ratio < 0.75, f'foreground ratio suspicious: {out_ratio}'
          assert iou > 0.68, f'foreground IoU too low: {iou}'
          assert mae < 55, f'pixel MAE too high: {mae}'
          assert corner_alpha < 16, f'background is not transparent: corner alpha {corner_alpha}'
          PY

      - name: Commit preview only, do not change live site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/logo-source-clean.png preview/logo-vtracer.svg preview/logo-vtracer-preview.png preview/logo-quality.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Build and verify VTracer logo preview'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
