name: Vectorize original logo and deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vectorize-logo.yml'
      - 'tools/logo-source-320.b64'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vectorize-logo
  cancel-in-progress: true

jobs:
  vectorize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild logo source
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n\r' < tools/logo-source-320.b64 | base64 -d > /tmp/logo-source.png
          test -s /tmp/logo-source.png
          file /tmp/logo-source.png
          python3 - <<'PY'
          import struct,zlib
          b=open('/tmp/logo-source.png','rb').read()
          assert b[:8] == b'\x89PNG\r\n\x1a\n'
          pos=8
          seen=False
          while pos < len(b):
              assert pos+12 <= len(b)
              n=struct.unpack('>I',b[pos:pos+4])[0]
              typ=b[pos+4:pos+8]
              data=b[pos+8:pos+8+n]
              crc=struct.unpack('>I',b[pos+8+n:pos+12+n])[0]
              assert (zlib.crc32(typ+data)&0xffffffff)==crc, typ
              pos += 12+n
              if typ == b'IEND':
                  seen=True
                  break
          assert seen and pos == len(b)
          print('PNG integrity OK:', len(b), 'bytes')
          PY

      - name: Fetch ImageTracerJS from GitHub
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/jankovicsandras/imagetracerjs.git /tmp/imagetracerjs
          test -s /tmp/imagetracerjs/nodecli/nodecli.js

      - name: Vectorize logo
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
          fi
          convert /tmp/logo-source.png -alpha off -type TrueColor /tmp/logo-rgb.png
          node /tmp/imagetracerjs/nodecli/nodecli.js \
            /tmp/logo-rgb.png \
            -outfilename "$GITHUB_WORKSPACE/assets/logo.svg" \
            numberofcolors 24 \
            pathomit 2 \
            ltres 0.35 \
            qtres 0.35 \
            colorquantcycles 4 \
            strokewidth 0 \
            roundcoords 2 \
            scale 1 \
            viewbox true \
            desc false
          test -s assets/logo.svg
          grep -q '<svg' assets/logo.svg
          ! grep -q '<image' assets/logo.svg
          paths=$(grep -o '<path' assets/logo.svg | wc -l)
          test "$paths" -gt 10
          echo "Vector paths: $paths"

      - name: Switch live header to vector logo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in ['watercolor.css','tests/site.test.mjs']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('assets/logo.png','assets/logo.svg')
              s=s.replace('original logo PNG','vectorized original logo SVG')
              p.write_text(s)
          PY
          grep -q 'assets/logo.svg' watercolor.css
          node tests/site.test.mjs

      - name: Commit generated SVG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/logo.svg watercolor.css tests/site.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Vectorize original Studiya Kids logo with ImageTracerJS'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Validate final site
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node tests/site.test.mjs
          test -s assets/logo.svg
          ! grep -q '<image' assets/logo.svg
          grep -q 'assets/logo.svg' watercolor.css

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
